name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python -m venv services/market-data/.venv
      - run: services/market-data/.venv/bin/pip install -e 'services/market-data[dev]'
      - run: services/market-data/.venv/bin/python -m pytest services/market-data/tests -q
